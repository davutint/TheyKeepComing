<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeadWalls Mobile Wave Market Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f4ead3;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      width: min(100vw, 1920px);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(0deg, rgba(0, 0, 0, 0.76), rgba(0, 0, 0, 0.18) 42%, rgba(0, 0, 0, 0.58)),
        linear-gradient(90deg, rgba(36, 25, 15, 0.64), rgba(9, 11, 10, 0.46) 36%, rgba(39, 35, 24, 0.44) 66%, rgba(16, 9, 7, 0.72)),
        repeating-linear-gradient(35deg, rgba(255, 244, 196, 0.025) 0 2px, transparent 2px 86px),
        linear-gradient(145deg, #0a0b09 0%, #151814 46%, #080706 100%);
      box-shadow: 0 0 120px rgba(0, 0, 0, 0.72) inset;
    }

    .stage::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34%;
      background:
        linear-gradient(180deg, transparent, rgba(17, 14, 10, 0.82) 58%, rgba(5, 4, 3, 0.96)),
        repeating-linear-gradient(92deg, rgba(74, 62, 42, 0.18) 0 6px, transparent 6px 52px);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 48%, transparent 0 34%, rgba(0, 0, 0, 0.36) 70%, rgba(0, 0, 0, 0.72) 100%),
        linear-gradient(to bottom, rgba(95, 65, 35, 0.1), rgba(0, 0, 0, 0.2));
      pointer-events: none;
    }

    .siege-scene {
      position: absolute;
      inset: 0;
      opacity: 0.72;
    }

    .wall {
      position: absolute;
      left: 50%;
      bottom: 19%;
      width: 610px;
      height: 132px;
      transform: translateX(-50%);
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 94px),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 2px, transparent 2px 44px),
        linear-gradient(180deg, #2d302b, #141613);
      border-top: 5px solid rgba(177, 153, 87, 0.24);
      border-bottom: 8px solid rgba(3, 3, 3, 0.72);
      box-shadow: 0 -18px 42px rgba(0, 0, 0, 0.36) inset, 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    .wall::before,
    .wall::after {
      content: "";
      position: absolute;
      bottom: 100%;
      width: 122px;
      height: 156px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 48px),
        linear-gradient(180deg, #343932, #191b18);
      border-top: 5px solid rgba(177, 153, 87, 0.24);
      box-shadow: 0 -18px 34px rgba(0, 0, 0, 0.34) inset;
    }

    .wall::before { left: 28px; }
    .wall::after { right: 28px; }

    .gate {
      position: absolute;
      left: 50%;
      bottom: 19%;
      width: 156px;
      height: 150px;
      transform: translateX(-50%);
      border-radius: 70px 70px 0 0;
      background:
        repeating-linear-gradient(90deg, rgba(255, 232, 159, 0.05) 0 3px, transparent 3px 25px),
        linear-gradient(180deg, #2b1b10, #110b07);
      border: 5px solid rgba(37, 35, 29, 0.95);
      box-shadow: 0 0 0 2px rgba(183, 151, 77, 0.2), 0 22px 42px rgba(0, 0, 0, 0.56) inset;
    }

    #MobileWaveMarketPanel {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: 1060px;
      height: 565px;
      transform: translate(-50%, -50%);
      background: url("../../Assets/UIExports/mobile_wave_market/sprites/panel_frame.png") center / 100% 100% no-repeat;
    }

    .sprite-layer {
      position: absolute;
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .stone-header {
      left: 54px;
      top: 42px;
      width: 952px;
      height: 142px;
      background-image: url("../../Assets/UIExports/mobile_wave_market/sprites/stone_header.png");
    }

    .castle-icon {
      left: 82px;
      top: 65px;
      width: 96px;
      height: 96px;
      background-image: url("../../Assets/UIExports/mobile_wave_market/sprites/castle_gate_icon.png");
    }

    .summary-card {
      left: 70px;
      top: 214px;
      width: 920px;
      height: 112px;
      background-image: url("../../Assets/UIExports/mobile_wave_market/sprites/summary_card.png");
    }

    .repair-bg {
      left: 54px;
      top: 388px;
      width: 286px;
      height: 104px;
      background-image: url("../../Assets/UIExports/mobile_wave_market/sprites/repair_button_bg.png");
    }

    .refill-bg {
      left: 363px;
      top: 388px;
      width: 286px;
      height: 104px;
      background-image: url("../../Assets/UIExports/mobile_wave_market/sprites/refill_arrows_button_bg.png");
    }

    .start-bg {
      left: 672px;
      top: 388px;
      width: 334px;
      height: 104px;
      background-image: url("../../Assets/UIExports/mobile_wave_market/sprites/start_next_wave_button_bg.png");
    }

    .header-context {
      position: absolute;
      left: 202px;
      top: 71px;
      width: 760px;
      height: 32px;
      display: flex;
      align-items: center;
      color: #d0b36b;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 1.2px;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.58);
    }

    #TitleText {
      position: absolute;
      left: 202px;
      top: 98px;
      width: 760px;
      height: 78px;
      margin: 0;
      display: flex;
      align-items: center;
      color: #f4ead3;
      font-size: 52px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.56);
    }

    #SummaryText {
      position: absolute;
      left: 105px;
      top: 228px;
      width: 850px;
      height: 84px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c8bfa7;
      font-size: 26px;
      line-height: 1.28;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.58);
    }

    button {
      position: absolute;
      top: 388px;
      height: 104px;
      border: 0;
      padding: 0 20px;
      background: transparent;
      color: #efe7d2;
      font: inherit;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: 0;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.54);
    }

    #RepairButton {
      left: 54px;
      width: 286px;
    }

    #RefillArrowsButton {
      left: 363px;
      width: 286px;
    }

    #StartNextWaveButton {
      left: 672px;
      width: 334px;
      color: #20170c;
      text-shadow: 0 1px 0 rgba(255, 239, 180, 0.34);
    }

    @media (max-width: 1360px) {
      #MobileWaveMarketPanel {
        transform: translate(-50%, -50%) scale(0.82);
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="1920 by 1080 mobile landscape UI preview">
    <div class="siege-scene" aria-hidden="true">
      <div class="wall"></div>
      <div class="gate"></div>
    </div>

    <section id="MobileWaveMarketPanel" data-unity-name="MobileWaveMarketPanel" aria-label="Wave cleared market panel">
      <div class="sprite-layer stone-header" aria-hidden="true"></div>
      <div class="sprite-layer castle-icon" aria-hidden="true"></div>
      <div class="sprite-layer summary-card" aria-hidden="true"></div>
      <div class="sprite-layer repair-bg" aria-hidden="true"></div>
      <div class="sprite-layer refill-bg" aria-hidden="true"></div>
      <div class="sprite-layer start-bg" aria-hidden="true"></div>
      <div class="header-context" aria-hidden="true">Castle Yard Ready</div>
      <h1 id="TitleText" data-unity-name="TitleText">Wave Cleared</h1>
      <p id="SummaryText" data-unity-name="SummaryText">Cleared Wave 07 | Next Wave 08 | Defense HP 84% | Arrows 43 / 120</p>
      <button id="RepairButton" data-unity-name="RepairButton">Repair</button>
      <button id="RefillArrowsButton" data-unity-name="RefillArrowsButton">Arrow Refill</button>
      <button id="StartNextWaveButton" data-unity-name="StartNextWaveButton">Start Next Wave</button>
    </section>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).has("verify")) {
      window.addEventListener("load", () => {
        const ids = ["MobileWaveMarketPanel", "TitleText", "SummaryText", "RepairButton", "RefillArrowsButton", "StartNextWaveButton"];
        const items = ids.map((id) => {
          const el = document.getElementById(id);
          if (!el) return { id, exists: false };
          const r = el.getBoundingClientRect();
          return {
            id,
            exists: true,
            x: Math.round(r.x),
            y: Math.round(r.y),
            width: Math.round(r.width),
            height: Math.round(r.height),
            overflowX: el.scrollWidth > el.clientWidth + 1,
            overflowY: el.scrollHeight > el.clientHeight + 1,
            text: (el.textContent || "").trim().replace(/\s+/g, " ")
          };
        });
        const panel = document.getElementById("MobileWaveMarketPanel").getBoundingClientRect();
        const buttons = ids.slice(3).map((id) => document.getElementById(id).getBoundingClientRect());
        const report = {
          viewport: { width: window.innerWidth, height: window.innerHeight },
          panelIsCentered: Math.abs((panel.left + panel.width / 2) - window.innerWidth / 2) < 2 &&
            Math.abs((panel.top + panel.height / 2) - window.innerHeight / 2) < 2,
          panelCoverage: {
            width: +(panel.width / window.innerWidth).toFixed(3),
            height: +(panel.height / window.innerHeight).toFixed(3)
          },
          minButtonHeight: Math.round(Math.min(...buttons.map((button) => button.height))),
          minButtonWidth: Math.round(Math.min(...buttons.map((button) => button.width))),
          items
        };
        const pre = document.createElement("pre");
        pre.id = "layout-report";
        pre.textContent = "REPORT_JSON:" + JSON.stringify(report);
        pre.style.display = "none";
        document.body.appendChild(pre);
      });
    }
  </script>
</body>
</html>
